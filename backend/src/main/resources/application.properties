spring.application.name=backend
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.profiles.active=local

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Existing initial schema
spring.flyway.validate-migration-naming=true

# Read only by the importer when both local and seed profiles are active.
app.sample-properties.path=${SAMPLE_PROPERTY_DATA_PATH:sample-data/cleaned_house_data.xlsx}
